name: Publicar Palácio Mental
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Regenerar índice e preparar site
        id: site
        run: node scripts/build.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.directory }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato gerado
        id: deployment
        uses: actions/deploy-pages@v4
